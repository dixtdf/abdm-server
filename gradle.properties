# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# ABDM bridge
#
# abdm.enabled=true  -> :server:engine-abdm is compiled against the
#                       third_party/ab-download-manager submodule
#                       (requires an Android SDK, because the upstream module
#                       declares an android target).
# abdm.enabled=false -> :server:engine-abdm compiles a stub; the server runs on
#                       the built-in native engine only.
# ---------------------------------------------------------------------------
abdm.enabled=false

# Directory used by the ABDM adapter when abdm.enabled=true
abdm.submodule.dir=third_party/ab-download-manager
