# =============================================================================
# abdm-server — single-service compose file.
#
# Create a .env next to this file (compose reads it for interpolation):
#   IMAGE_OWNER=dixtdf              # or your own fork
#   IMAGE_TAG=latest                 # or edge, 0.1.0, ...
#   DOWNLOAD_HOST_PATH=/mnt/downloads
#   AUTH_MODE=none                   # none | token
#   AUTH_TOKEN=                      # only when AUTH_MODE=token
#
#   docker compose up -d
#   curl http://127.0.0.1:6868/api/v1/health
#
# Pulls the published image:
#   image: ghcr.io/<IMAGE_OWNER>/abdm-server:<IMAGE_TAG>
#
# --- switching to a locally built image --------------------------------------
#   1. docker build -t abdm-server:local .
#   2. in .env:  IMAGE_OWNER=abdm-server  IMAGE_TAG=local  (or any local tag)
#   3. docker compose up -d --force-recreate
#   With `IMAGE_OWNER=abdm-server` the resolved image becomes
#   `ghcr.io/abdm-server/abdm-server:local`, which does not exist upstream, so
#   compose will use your local tag once you also set:
#     image: abdm-server:local      # <- or just uncomment the override below
#
#   The simplest local override is a `docker-compose.override.yml`:
#     services:
#       downloader:
#         image: abdm-server:local
#         build:
#           context: .
# =============================================================================

services:
  downloader:
    # Defaults to the upstream project image; override IMAGE_OWNER in .env for your fork.
    image: ghcr.io/${IMAGE_OWNER:-dixtdf}/abdm-server:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-abdm-server}
    restart: always
    privileged: true

    ports:
      # host:container. The container always listens on the image's PORT (6868);
      # PORT in .env only moves the host side of the mapping.
      - "${PORT:-6868}:6868"

    volumes:
      # SQLite database, settings and logs. Must be writable by uid 1000.
      - ./config:/config
      # Payload directory. Change the host side to wherever your disks live.
      - ${DOWNLOAD_HOST_PATH:-/mnt/downloads}:/downloads

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # none | token — with `token` set ABDM_AUTH_TOKEN below.
      ABDM_AUTH_MODE: ${AUTH_MODE:-none}
      ABDM_AUTH_TOKEN: ${AUTH_TOKEN:-}
      # native | abdm
      ABDM_ENGINE: ${ENGINE:-native}
      ABDM_LOG_LEVEL: ${LOG_LEVEL:-info}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6868/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
