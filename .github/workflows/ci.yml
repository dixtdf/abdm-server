name: CI

# Continuous integration for abdm-server.
#   backend     — Gradle build + unit tests (stub adapter, no Android SDK)
#   frontend    — npm ci, i18n gate, lint, typecheck, tests, production build
#   docker      — image build with a real Dockerfile check, pushed nowhere
#
# The ABDM adapter compatibility canary (JDK 25 + Android SDK) is a separate
# workflow, `.github/workflows/abdm-compat.yml`: it runs weekly instead of on every
# push, so this file stays fast and dependency free.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pushes/PR updates cancel their predecessors.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  ABDM_SUBMODULE: third_party/ab-download-manager

jobs:
  # ---------------------------------------------------------------------------
  # Kotlin / JVM
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Kotlin / JVM 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # A Windows checkout with core.filemode=false can commit `gradlew` as 100644,
      # which fails here with a bare "Permission denied" (exit 126). Fail fast with a
      # message that says what to do instead.
      - name: Check the shell entry points
        run: |
          set -euo pipefail
          test -x gradlew || {
            echo "::error::gradlew is not executable. Fix it with: git update-index --chmod=+x gradlew && git commit -m 'fix: restore the executable bit'"
            exit 1
          }
          bash -n gradlew
          for script in scripts/*.sh; do bash -n "$script"; done

      # abdm.enabled=false keeps CI free of any Android SDK requirement; the
      # adapter module compiles its stub and the server uses the native engine.
      - name: Build and test
        run: ./gradlew --no-daemon build -Pabdm.enabled=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Vue 3 + Vite
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Vue 3 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Hard gate: every errors.<CODE> from docs/api.md must exist in every
      # locale file (scripts/check-i18n.mjs).
      - name: Validate locales
        run: npm run i18n:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Container image — built, never pushed.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # amd64 only: `load: true` cannot import a multi-platform manifest.
          platforms: linux/amd64
          push: false
          load: true
          tags: abdm-server:ci
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,mode=max,scope=docker-ci

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          # The container runs as uid 1000 (`abdm`); bind mounts are root-owned by
          # default, so pre-create them and relax the mode, otherwise SQLite
          # cannot create /config/database.sqlite and the probe never goes green.
          mkdir -p .ci-config .ci-downloads
          chmod -R 777 .ci-config .ci-downloads
          docker run -d --name abdm-smoke \
            -p 6868:6868 \
            -v "$PWD/.ci-config:/config" \
            -v "$PWD/.ci-downloads:/downloads" \
            abdm-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6868/api/v1/health; then
              echo
              echo "health probe ok after ${i}s"
              docker rm -f abdm-smoke
              exit 0
            fi
            sleep 2
          done
          echo "health probe never became ready" >&2
          docker logs abdm-smoke || true
          docker rm -f abdm-smoke || true
          exit 1
