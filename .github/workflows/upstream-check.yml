name: Upstream check

# Weekly check of the pinned AB Download Manager release.
#
# When upstream publishes something newer than the pin recorded in
# docs/upstream.md, this opens a PR that only moves the submodule pointer and the
# matching pin block - never code. The PR carries the `abdm-compat` label and must
# never be auto-merged: `ABDM adapter compatibility` has to pass first, because a new
# upstream tag may rename or drop an API the adapter relies on.
on:
  schedule:
    # Mondays 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: upstream-check

jobs:
  check:
    name: Compare the pin with the latest upstream release
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: amir1376/ab-download-manager
      SUBMODULE_PATH: third_party/ab-download-manager
      PIN_DOC: docs/upstream.md
      PR_LABEL: abdm-compat
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read the pin and resolve the latest upstream release
        id: versions
        run: |
          set -euo pipefail
          pinned="$(sed -n -E 's/^UPSTREAM_VERSION=(.*)$/\1/p' "$PIN_DOC" | head -n1)"
          pinned_commit="$(sed -n -E 's/^UPSTREAM_COMMIT=(.*)$/\1/p' "$PIN_DOC" | head -n1)"
          if [ -z "$pinned" ] || [ -z "$pinned_commit" ]; then
            echo "::error::no UPSTREAM_VERSION/UPSTREAM_COMMIT pin block in $PIN_DOC"
            exit 1
          fi
          latest="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::could not resolve the latest release of $UPSTREAM_REPO"
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "pinned_commit=$pinned_commit" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned: $pinned ($pinned_commit)"
          echo "latest upstream release: $latest"

      - name: Decide whether an update is needed
        id: compare
        env:
          PINNED: ${{ steps.versions.outputs.pinned }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          pinned="${PINNED#v}"
          latest="${LATEST#v}"
          update=false
          if [ "$pinned" = "$latest" ]; then
            echo "pin is current ($PINNED)"
          elif [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n1)" = "$latest" ]; then
            update=true
            echo "::notice::upstream $LATEST is newer than the pin $PINNED"
          else
            echo "::warning::the pin ($PINNED) is ahead of the latest release ($LATEST)"
          fi
          echo "update=$update" >> "$GITHUB_OUTPUT"

      - name: Move the submodule pointer and update the pin block
        if: steps.compare.outputs.update == 'true'
        id: bump
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          git -C "$SUBMODULE_PATH" fetch --tags --prune origin
          git -C "$SUBMODULE_PATH" checkout --detach "$LATEST"
          new_commit="$(git -C "$SUBMODULE_PATH" rev-parse HEAD)"
          new_date="$(git -C "$SUBMODULE_PATH" show -s --format=%cs "$new_commit")"
          sed -i -E "s|^UPSTREAM_VERSION=.*|UPSTREAM_VERSION=$LATEST|" "$PIN_DOC"
          sed -i -E "s|^UPSTREAM_COMMIT=.*|UPSTREAM_COMMIT=$new_commit|" "$PIN_DOC"
          sed -i -E "s|^UPSTREAM_PINNED_DATE=.*|UPSTREAM_PINNED_DATE=$new_date|" "$PIN_DOC"
          echo "commit=$new_commit" >> "$GITHUB_OUTPUT"
          echo "date=$new_date" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Open the pull request
        if: steps.compare.outputs.update == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
          PREVIOUS: ${{ steps.versions.outputs.pinned }}
          NEW_COMMIT: ${{ steps.bump.outputs.commit }}
          NEW_DATE: ${{ steps.bump.outputs.date }}
        run: |
          set -euo pipefail
          branch="chore/abdm-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SUBMODULE_PATH" "$PIN_DOC"
          git commit -m "chore: update AB Download Manager to ${LATEST}"
          git push --force-with-lease origin "HEAD:refs/heads/${branch}"

          # The label has to exist before it can be attached; a failure here only
          # means it already exists.
          gh label create "$PR_LABEL" \
            --color FBCA04 \
            --description "Touches the AB Download Manager adapter or submodule" \
            >/dev/null 2>&1 || true

          {
            echo "Automated weekly upstream check (\`.github/workflows/upstream-check.yml\`)."
            echo
            echo "- previous pin: \`${PREVIOUS}\`"
            echo "- new release: \`${LATEST}\`"
            echo "- upstream commit: \`${NEW_COMMIT}\` (${NEW_DATE})"
            echo
            echo "This PR only moves the submodule pointer and the pin block in \`${PIN_DOC}\`."
            echo "It contains no source changes."
            echo
            echo "Do not merge before the adapter compatibility test passes:"
            echo
            echo '```bash'
            echo "bash scripts/check-abdm.sh"
            echo "./gradlew -Pabdm.enabled=true :server:engine-abdm:test"
            echo '```'
            echo
            echo "The \`ABDM adapter compatibility\` workflow runs this automatically for"
            echo "changes under \`server/engine-abdm/\` and weekly."
          } > pr-body.md

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore: update AB Download Manager to ${LATEST}" \
            --body-file pr-body.md \
            --label "$PR_LABEL"

      - name: Summary
        if: steps.compare.outputs.update != 'true'
        env:
          PINNED: ${{ steps.versions.outputs.pinned }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          {
            echo "### Upstream check"
            echo
            echo "- pinned: ${PINNED}"
            echo "- latest: ${LATEST}"
            echo
            echo "No update needed."
          } >> "$GITHUB_STEP_SUMMARY"
