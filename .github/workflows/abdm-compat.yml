name: ABDM adapter compatibility

# Compatibility canary for the AB Download Manager bridge.
#
# Deliberately *not* part of the per-push CI: exporting the upstream runtime needs
# JDK 25 (upstream pins jvm.toolchain=25) and an Android SDK carrying the platform
# upstream compiles against, so it runs weekly, on demand, and when something that
# can affect the adapter changes.
on:
  schedule:
    # Mondays 04:00 UTC, one hour after the upstream-check job.
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/engine-abdm/**'
      - 'third_party/ab-download-manager'
      - 'docs/upstream.md'
      - 'scripts/build-abdm-bridge.sh'
      - 'scripts/check-abdm.sh'
      - '.github/workflows/abdm-compat.yml'
  pull_request:
    paths:
      - 'server/engine-abdm/**'
      - 'scripts/build-abdm-bridge.sh'
      - 'docs/upstream.md'

permissions:
  contents: read

concurrency:
  group: abdm-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  compat:
    name: Adapter compiles and passes AbdmCompatibilityTest
    runs-on: ubuntu-latest
    env:
      UPSTREAM_PLATFORM: android-37
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate the Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::Android SDK not found at $sdk"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "using Android SDK at $sdk"

      # Upstream compiles against platforms;android-37. Runner images ship older
      # platforms, and AGP fails during configuration when the target is missing.
      - name: Install the Android platform upstream compiles against
        run: |
          set -euo pipefail
          sdkmanager="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$sdkmanager" ]; then
            echo "::warning::sdkmanager not found; relying on the preinstalled platforms"
            ls "${ANDROID_HOME}/platforms" || true
            exit 0
          fi
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;${UPSTREAM_PLATFORM}" >/dev/null || echo "::warning::could not install platforms;${UPSTREAM_PLATFORM}"
          echo "installed platforms: $(ls "${ANDROID_HOME}/platforms" | tr '\n' ' ')"

      - name: Verify the pinned submodule
        run: bash scripts/check-abdm.sh

      # The adapter compiles against the upstream runtime exported into
      # third_party/abdm-dist. Cached on the pin, so the weekly run is fast.
      - name: Cache the exported bridge
        uses: actions/cache@v4
        with:
          path: third_party/abdm-dist
          key: abdm-dist-${{ hashFiles('docs/upstream.md') }}

      - name: Check the exported bridge
        id: bridge
        run: |
          set -euo pipefail
          if compgen -G "third_party/abdm-dist/*.jar" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "bridge jars present, skipping the export"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25 for the bridge export
        if: steps.bridge.outputs.present == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Export the ABDM bridge
        if: steps.bridge.outputs.present == 'false'
        run: bash scripts/build-abdm-bridge.sh

      - name: Restore JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # AbdmCompatibilityTest is the point of this workflow: it drives the real
      # upstream engine through create/pause/resume/remove, live connection changes,
      # restart recovery and the per connection part table (see docs/upstream.md).
      - name: Compatibility test
        run: ./gradlew --no-daemon -Pabdm.enabled=true :server:engine-abdm:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abdm-compat-test-reports
          path: 'server/engine-abdm/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7
