name: Release

# Triggered by an annotated/lightweight tag like v0.1.0:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces:
#   ghcr.io/<owner>/abdm-server:v0.1.0 and :0.1 (linux/amd64 + linux/arm64)
#   a GitHub Release with server.jar, docker-compose.yml and SHA256SUMS
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --- verification ------------------------------------------------------
      - name: Backend tests
        run: ./gradlew --no-daemon build -Pabdm.enabled=false

      - name: Frontend install
        working-directory: web
        run: npm ci

      - name: Frontend i18n validation
        working-directory: web
        run: npm run i18n:check

      - name: Frontend tests
        working-directory: web
        run: npm run test

      - name: Frontend build
        working-directory: web
        run: npm run build

      # --- release artifacts -------------------------------------------------
      - name: Build fat jar
        run: ./gradlew --no-daemon -Pabdm.enabled=false :server:app:shadowJar

      - name: Stage artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jar="server/app/build/libs/abdm-server-${version}-all.jar"
          if [ ! -f "$jar" ]; then
            # Fall back to whatever shadowJar produced, so a version drift does
            # not silently publish an empty release.
            jar="$(ls -1 server/app/build/libs/*-all.jar | head -n1)"
          fi
          mkdir -p dist
          cp "$jar" dist/server.jar
          cp docker-compose.yml dist/docker-compose.yml
          ls -l dist

      - name: Compute SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum server.jar docker-compose.yml > SHA256SUMS
          cat SHA256SUMS

      # --- container image ---------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=abdm-server
            org.opencontainers.image.description=Self-hosted download manager (Ktor + Vue 3)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,mode=max,scope=docker-release

      # --- GitHub Release ----------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: abdm-server ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          files: |
            dist/server.jar
            dist/docker-compose.yml
            dist/SHA256SUMS
          body: |
            ## abdm-server ${{ github.ref_name }}

            Container image (multi-arch, `linux/amd64` + `linux/arm64`):

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Release assets:

            | File | Description |
            | --- | --- |
            | `server.jar` | Executable fat jar (`java -jar server.jar`) |
            | `docker-compose.yml` | Compose file matching this release |
            | `SHA256SUMS` | SHA-256 checksums of the two files above |

            Verify the download before running it:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            Upstream engine pin: see `docs/upstream.md`.

            _This project is not affiliated with or endorsed by AB Download Manager._
